name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length=88 \
            --extend-ignore=E203,W503 \
            --exclude=src/dashboard/

      - name: Run unit tests
        run: |
          python -m pytest tests/test_features.py tests/test_models.py \
            -v --tb=short

      - name: Check import health
        run: |
          python -c "from src.config.settings import FORECAST_HORIZONS; print('Config OK')"
          python -c "from src.features.feature_pipeline import FeaturePipeline; print('Features OK')"
          python -c "from src.models.xgboost_model import TimeSeriesForecaster; print('Model OK')"
